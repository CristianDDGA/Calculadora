<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Integrantes del Grupo</title>
  <link href="index.css" rel="stylesheet">
  <style>
    body {
      background-color: #224870;
      color: white;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header.header-con-menu {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #006f54;
      padding: 20px;
      color: white;
      font-size: 2em;
      box-shadow: 0px 5px 10px -3px #00000040;
    }

    .menu-esquina {
      position: relative;
      z-index: 1000;
    }

    .menu-esquina button {
      background-color: #00916e;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .menu-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
      background-color: #006f54;
      border-radius: 6px;
      box-shadow: 0 6px 10px rgba(0,0,0,0.3);
      position: absolute;
      top: 48px;
      left: 0;
      z-index: 1001;
      width: 220px;
    }

    .menu-list li {
      padding: 12px 16px;
      color: white;
      cursor: pointer;
      font-size: 1em;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-list li:last-child {
      border-bottom: none;
    }

    .menu-list li:hover {
      background-color: #008d6f;
    }

    .menu-list a {
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .integrantes-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 40px;
      padding: 100px 40px 40px;
    }

    .card {
      background-color: #e0f7fa;
      border-radius: 12px;
      width: 250px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin: 0;
      color: #003;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON MENÚ -->
  <header class="header-con-menu">
    <h1>Integrantes del Grupo</h1>
    <nav class="menu-esquina">
      <button onclick="toggleMenu()">☰ </button>
      <ul id="menu" class="menu-list hidden">
        <li><a href="integrantes.html">👤 Ver integrantes</a></li>
        <li><a href="index.html">🧮 Ir a calculadora</a></li>
      </ul>
    </nav>
  </header>

  <!-- TARJETAS DE INTEGRANTES -->
  <section class="integrantes-grid">
    <div class="card">
      <img src="cristian.png" alt="Cristian Ango">
      <h3>Cristian Ango</h3>
    </div>
    <div class="card">
      <img src="jorge.png" alt="Jorge Sailema">
      <h3>Jorge Sailema</h3>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/250x200?text=Julio+Jacho" alt="Julio Jacho">
      <h3>Julio Jacho</h3>
    </div>
  </section>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.classList.toggle('hidden');
    }
  </script>
</body>
</html>
