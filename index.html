<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="index.css" rel="stylesheet">
    <script src="Calculadora.js"></script>
    <script src="Display.js"></script>
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Calculadora</h1>
        <nav>
            <button onclick="toggleMenu()">Menú</button>
            <ul id="menu" class="hidden">
                <li><strong>Integrantes del grupo:</strong></li>
                 <li>Cristian Ango</li>
                 <li>Jorge Sailema</li>
                 <li>Julio Jacho</li>
                 <li><button onclick="toggleMenu()">Cerrar Menú</button></li>
            </ul>   
        </nav>
    </header>
<div class="flex-container">
  <!-- CALCULADORA -->
  <div class="calculadora">
      <div class="display">
          <div id="valor-anterior"></div>
          <div id="valor-actual"></div>
      </div>
      <button class="col-2" onclick="display.borrarTodo()">C</button>
      <button onclick="display.borrar()">&larr;</button>
      <button class="operador" value="raizCuadrada">√</button>

      <button class="operador" value="potenciaCuadrado">x²</button>
      <button class="operador" value="dividir">%</button>
      <button class="operador" value="multiplicar">X</button>
      <button class="operador" value="restar">-</button>

      <button class="numero">7</button>
      <button class="numero">8</button>
      <button class="numero">9</button>
      <button class="operador" value="sumar">+</button>

      <button class="numero">4</button>
      <button class="numero">5</button>
      <button class="numero">6</button>
      <button class="numero">.</button>

      <button class="numero">1</button>
      <button class="numero">2</button>
      <button class="numero">3</button>
      <button class="igual operador" value="igual">=</button>

      <button class="col-2 numero">0</button>
  </div>

  <!-- HISTORIAL -->
  <div id="historial-container" class="historial-box">
      <h4>Historial</h4>
      <div id="historial"></div>
      <button onclick="limpiarHistorial()">Limpiar Historial</button>
  </div>
</div>


   
</body>
</html>
